<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Wordbook</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f6f5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wordbook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#faf8f4; --card:#ffffff; --ink:#1f2328; --sub:#6b7280; --line:#e5e1d8;
  --accent:#2f6f5e; --accent-ink:#ffffff; --warn:#b4432f; --chip:#efece4;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181a; --card:#1f2326; --ink:#ecebe6; --sub:#9aa0a6; --line:#2e3438;
    --accent:#6fbfa8; --accent-ink:#0f1a16; --warn:#e07a63; --chip:#2a2f33;
  }
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);
}
.wrap{max-width:640px; margin:0 auto; padding:16px 16px 110px;}
h1{font-size:20px; margin:4px 0 14px; letter-spacing:.02em;}
h1 small{font-weight:400; color:var(--sub); font-size:13px; margin-left:8px;}
.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;}
input,textarea,button{font:inherit; color:inherit;}
input,textarea{
  width:100%; padding:10px 12px; background:var(--card); border:1px solid var(--line);
  border-radius:10px; font-size:16px; outline:none;
}
input:focus,textarea:focus{border-color:var(--accent);}
textarea{resize:vertical; min-height:64px;}
button{cursor:pointer; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 14px;}
button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600;}
button.danger{color:var(--warn); border-color:var(--warn); background:transparent;}
button.ghost{background:transparent;}
button:disabled{opacity:.5; cursor:default;}
.row{display:flex; gap:8px; align-items:center;}
.row > input{flex:1;}
.status{min-height:22px; margin:6px 2px 0; font-size:13px; color:var(--sub);}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px;}
.list{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
.item{cursor:pointer;}
.item .top{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
.item .w{font-size:19px; font-weight:600;}
.item .ipa{color:var(--sub); font-size:13px;}
.item .def{color:var(--sub); font-size:14px; margin-top:2px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
.chip{display:inline-block; background:var(--chip); color:var(--sub); border-radius:999px; padding:1px 9px; font-size:12px;}
.chip.due{background:var(--accent); color:var(--accent-ink);}
.empty{color:var(--sub); text-align:center; padding:36px 8px;}
.stats{color:var(--sub); font-size:13px; margin:12px 2px 0;}
nav{
  position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); z-index:5;
}
nav button{flex:1; border:none; border-radius:0; background:transparent; padding:12px 4px; color:var(--sub); font-size:13px;}
nav button.on{color:var(--accent); font-weight:700;}
.hide{display:none !important;}
.flash{min-height:260px; display:flex; flex-direction:column; justify-content:center; text-align:left; cursor:pointer;}
.flash .big{font-size:34px; font-weight:600; text-align:center;}
.flash .hint{color:var(--sub); font-size:13px; text-align:center; margin-top:14px;}
.meaning{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line);}
.meaning .ex{color:var(--sub); font-style:italic; margin-top:2px;}
.ans{display:flex; gap:10px; margin-top:12px;}
.ans button{flex:1; padding:14px;}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:20; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.sheet{
  background:var(--bg); max-width:640px; margin:0 auto; min-height:100%;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px));
}
.sheet label{display:block; font-size:13px; color:var(--sub); margin:14px 2px 4px;}
.mrow{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:8px;}
.mrow .r1{display:flex; gap:8px; margin-bottom:6px;}
.mrow .r1 input{flex:1;}
.mrow .r1 button{padding:6px 12px;}
.actions{display:flex; gap:10px; margin-top:20px;}
.actions button{flex:1; padding:13px;}
#toast{
  position:fixed; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:14px;
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; max-width:90%;
}
#toast.on{opacity:1;}
.mt{margin-top:14px;}
.small{font-size:13px; color:var(--sub);}
</style>
</head>
<body>
<div class="wrap">
  <h1>My Wordbook<small id="count"></small></h1>

  <!-- 単語帳 -->
  <section id="view-list">
    <div class="row">
      <input id="addInput" placeholder="知らなかった単語・フレーズを入力" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <button id="addBtn" class="primary">調べる</button>
    </div>
    <div class="status" id="addStatus"></div>
    <div class="row" style="margin-top:2px">
      <button id="manualBtn" class="ghost small" style="padding:6px 10px">手動で追加</button>
    </div>
    <div class="mt"><input id="search" type="search" placeholder="登録済みの単語を検索"></div>
    <div class="stats" id="stats"></div>
    <div class="list" id="list"></div>
  </section>

  <!-- 復習 -->
  <section id="view-review" class="hide">
    <div class="row" style="justify-content:space-between">
      <div class="small" id="revInfo"></div>
      <button id="revAll" class="ghost small" style="padding:6px 10px">全単語で復習</button>
    </div>
    <div id="revBody" class="mt"></div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" class="hide">
    <div class="card">
      <div style="font-weight:600">保存場所</div>
      <div class="small" style="margin-top:4px">単語はこの端末のブラウザ内に保存されます。<b>Safariで開いたときと、ホーム画面のアイコンから開いたときでは、データが別々</b>になります。ホーム画面に追加してから使い始めてください。</div>
      <div class="small" id="persistInfo" style="margin-top:6px"></div>
    </div>
    <div class="card mt">
      <div style="font-weight:600">バックアップ(書き出し)</div>
      <div class="small" style="margin:4px 0 10px">単語帳をJSONで保存します。機種変更や不具合に備えて、時々どうぞ。</div>
      <div class="row">
        <button id="expSave">保存・共有</button>
        <button id="expCopy">コピー</button>
      </div>
    </div>
    <div class="card mt">
      <div style="font-weight:600">読み込み(復元)</div>
      <div class="small" style="margin:4px 0 8px">書き出したJSONを読み込みます。同じ単語は上書きされます。</div>
      <input id="impFile" type="file" accept=".json,application/json">
      <div class="small" style="margin:10px 0 4px">またはJSONを貼り付け</div>
      <textarea id="impText" placeholder='{"words":[...]} または [...]'></textarea>
      <div class="actions"><button id="impBtn" class="primary">読み込む</button></div>
    </div>
    <div class="small mt" style="text-align:center">意味の取得:Free Dictionary API(予備:Wiktionary) / 日本語訳の提案:MyMemory</div>
  </section>
</div>

<div id="editor" class="overlay hide"></div>
<div id="toast"></div>

<nav>
  <button data-tab="list" class="on">単語帳</button>
  <button data-tab="review">復習</button>
  <button data-tab="settings">設定</button>
</nav>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const DAY = 864e5, LEIT = [0, 1, 3, 7, 21, 45];
const LS = 'wordbook:v1';

let words = [];
let tab = 'list', query = '';
let review = { queue: [], i: 0, shown: false, all: false };
let draft = null;

/* ---------- helpers ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}
function toId(w) {
  let id = w.trim().toLowerCase().replace(/[^a-z0-9_\-.~:@+]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 100);
  if (!id || /^\.+$/.test(id)) id = 'w' + Date.now();
  return id;
}
function speak(t) {
  try { const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function dueLabel(w) {
  const d = (w.due || 0) - Date.now();
  if (d <= 0) return { t: '復習待ち', due: true };
  return { t: Math.ceil(d / DAY) + '日後', due: false };
}
const byId = id => words.find(w => w.id === id);
const blankMeaning = () => ({ pos: '', def: '', ex: '' });

/* ---------- storage (localStorage) ---------- */
function loadLocal() {
  try { const j = JSON.parse(localStorage.getItem(LS) || '[]'); return Array.isArray(j) ? j : []; } catch (e) { return []; }
}
function persistLocal() {
  try { localStorage.setItem(LS, JSON.stringify(words)); return true; }
  catch (e) { toast('保存に失敗しました(容量不足の可能性)'); return false; }
}
function putWord(w) {
  const i = words.findIndex(x => x.id === w.id);
  if (i >= 0) words[i] = w; else words.push(w);
  const ok = persistLocal();
  renderAll();
  return ok;
}
function delWord(id) {
  words = words.filter(x => x.id !== id);
  persistLocal(); renderAll();
}

/* ---------- lookup (Free Dictionary API → Wiktionary fallback) ---------- */
function fetchWithTimeout(url, ms = 7000) {
  // AbortController を使わない方式(中継環境でも動くように)
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => reject(new Error('時間切れ')), ms);
    fetch(url).then(
      r => { clearTimeout(t); resolve(r); },
      e => { clearTimeout(t); reject(e); }
    );
  });
}
function stripHtml(s) {
  const d = new DOMParser().parseFromString(String(s || ''), 'text/html');
  return (d.body.textContent || '').replace(/\s+/g, ' ').trim();
}

async function lookupFreeDict(word) {
  const res = await fetchWithTimeout('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word.toLowerCase()));
  if (res.status === 404) return { notFound: true };
  if (!res.ok) throw new Error('辞書A: HTTP ' + res.status);
  const data = await res.json();
  const entries = Array.isArray(data) ? data : [];
  if (!entries.length) return { notFound: true };
  const e0 = entries[0];
  const ipa = e0.phonetic || ((e0.phonetics || []).map(p => p.text).find(Boolean)) || '';
  const meanings = [];
  const seen = new Set();
  for (const en of entries) {
    for (const m of (en.meanings || [])) {
      if (seen.has(m.partOfSpeech)) continue;
      seen.add(m.partOfSpeech);
      for (const d of (m.definitions || []).slice(0, 2)) {
        meanings.push({ pos: m.partOfSpeech || '', def: d.definition || '', ex: d.example || '' });
      }
    }
  }
  return { headword: e0.word || word, ipa, meanings: meanings.slice(0, 5) };
}

async function lookupWiktionary(word) {
  const res = await fetchWithTimeout('https://en.wiktionary.org/api/rest_v1/page/definition/' + encodeURIComponent(word.toLowerCase()));
  if (res.status === 404) return { notFound: true };
  if (!res.ok) throw new Error('辞書B: HTTP ' + res.status);
  const data = await res.json();
  const secs = Array.isArray(data && data.en) ? data.en : [];
  if (!secs.length) return { notFound: true };
  const meanings = [];
  for (const sec of secs) {
    const pos = (sec.partOfSpeech || '').toLowerCase();
    for (const d of (sec.definitions || []).slice(0, 2)) {
      const def = stripHtml(d.definition);
      if (!def) continue;
      const raw = (d.parsedExamples && d.parsedExamples[0] && d.parsedExamples[0].example) || (d.examples && d.examples[0]) || '';
      meanings.push({ pos, def, ex: stripHtml(raw) });
    }
  }
  if (!meanings.length) return { notFound: true };
  return { headword: word, ipa: '', meanings: meanings.slice(0, 5) };
}

async function lookup(word) {
  const errs = [];
  let missing = 0;
  for (const fn of [lookupFreeDict, lookupWiktionary]) {
    try {
      const r = await fn(word);
      if (!r.notFound) return r;
      missing++;
    } catch (e) {
      errs.push((e && e.message) || String(e));
    }
  }
  if (missing === 0 && errs.length) throw new Error(errs.join(' / '));
  return { notFound: true };
}

async function suggestJa(word, apply, btn) {
  if (!word.trim()) { toast('先に単語を入力してください'); return; }
  btn.disabled = true;
  try {
    const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word.trim()) + '&langpair=en|ja');
    const j = await res.json();
    const t = j && j.responseData && j.responseData.translatedText;
    if (!t || t.trim().toLowerCase() === word.trim().toLowerCase()) toast('日本語訳が見つかりませんでした');
    else apply(t.trim());
  } catch (e) {
    toast('取得できませんでした(通信状況を確認してください)');
  } finally {
    btn.disabled = false;
  }
}

function setStatus(msg) { $('#addStatus').textContent = msg || ''; }

async function onLookup() {
  const inp = $('#addInput');
  const w = inp.value.trim();
  if (!w) return;
  const id = toId(w);
  const ex = byId(id);
  if (ex) { toast('登録済みです'); openEditor(ex); return; }
  $('#addBtn').disabled = true;
  setStatus('調べています…');
  try {
    const r = await lookup(w);
    if (r.notFound) {
      setStatus('辞書に見つかりませんでした。「手動で追加」で自分で入力できます。');
    } else {
      setStatus('');
      openEditor({ isNew: true, word: r.headword, ipa: r.ipa, meanings: r.meanings.length ? r.meanings : [blankMeaning()], context: '', note: '' });
    }
  } catch (e) {
    setStatus('取得できませんでした(' + ((e && e.message) || '原因不明') + ')。通信状況を確認するか、「手動で追加」を使ってください。');
  } finally {
    $('#addBtn').disabled = false;
  }
}

/* ---------- editor ---------- */
function openEditor(src) {
  draft = {
    id: src.id, isNew: !!src.isNew,
    word: src.word || '', ipa: src.ipa || '',
    meanings: (src.meanings && src.meanings.length ? src.meanings : [blankMeaning()]).map(m => ({ pos: m.pos || '', def: m.def || '', ex: m.ex || '' })),
    context: src.context || '', note: src.note || '',
    box: src.box, due: src.due, created: src.created
  };
  renderEditor();
  const ed = $('#editor');
  ed.classList.remove('hide');
  ed.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeEditor() {
  $('#editor').classList.add('hide');
  document.body.style.overflow = '';
  draft = null;
}
function renderEditor() {
  const ed = $('#editor');
  ed.replaceChildren();
  const mbox = h('div');
  const drawMeanings = () => {
    mbox.replaceChildren(...draft.meanings.map((m, i) =>
      h('div', { class: 'mrow' },
        h('div', { class: 'r1' },
          h('input', { placeholder: '品詞 (noun, verb…)', value: m.pos, oninput: e => { m.pos = e.target.value; } }),
          h('button', { class: 'ghost', onclick: () => { draft.meanings.splice(i, 1); drawMeanings(); } }, '✕')
        ),
        h('textarea', { placeholder: '英語での意味', value: m.def, oninput: e => { m.def = e.target.value; } }),
        h('textarea', { placeholder: '例文(任意)', style: 'margin-top:6px', value: m.ex, oninput: e => { m.ex = e.target.value; } })
      )
    ));
  };
  drawMeanings();

  const noteArea = h('textarea', { value: draft.note, oninput: e => { draft.note = e.target.value; } });
  const jaBtn = h('button', { class: 'ghost', style: 'margin-top:6px;padding:6px 12px', onclick: e => {
    suggestJa(draft.word, t => {
      draft.note = draft.note.trim() ? draft.note.trim() + ' / ' + t : t;
      noteArea.value = draft.note;
    }, e.currentTarget);
  } }, '日本語訳を提案(自動・精度は参考程度)');

  const sheet = h('div', { class: 'sheet' },
    h('div', { style: 'font-size:18px;font-weight:700' }, draft.isNew ? 'この内容で登録しますか?' : '編集'),
    draft.isNew ? h('div', { class: 'small' }, '不要な意味は✕で消せます。内容は自由に直せます。') : null,
    h('label', {}, '単語'),
    h('input', { value: draft.word, readonly: !draft.isNew, oninput: e => { draft.word = e.target.value; } }),
    h('label', {}, '発音記号'),
    h('input', { value: draft.ipa, oninput: e => { draft.ipa = e.target.value; } }),
    h('label', {}, '意味(英語)'),
    mbox,
    h('button', { class: 'ghost', style: 'margin-top:8px;width:100%', onclick: () => { draft.meanings.push(blankMeaning()); drawMeanings(); } }, '+ 意味を追加'),
    h('label', {}, 'この単語に出会った文(任意)'),
    h('textarea', { value: draft.context, oninput: e => { draft.context = e.target.value; } }),
    h('label', {}, '日本語メモ(任意)'),
    noteArea,
    jaBtn,
    h('div', { class: 'actions' },
      h('button', { onclick: closeEditor }, 'キャンセル'),
      h('button', { class: 'primary', onclick: saveDraft }, draft.isNew ? '登録する' : '保存')
    ),
    !draft.isNew ? h('div', { class: 'actions' },
      h('button', { class: 'danger', onclick: () => {
        if (!confirm('「' + draft.word + '」を削除しますか?')) return;
        delWord(draft.id); closeEditor(); toast('削除しました');
      } }, 'この単語を削除')
    ) : null
  );
  ed.append(sheet);
}
function saveDraft() {
  const word = draft.word.trim();
  if (!word) { toast('単語を入力してください'); return; }
  const id = draft.id || toId(word);
  if (draft.isNew && byId(id)) { toast('すでに登録されています'); return; }
  const meanings = draft.meanings
    .map(m => ({ pos: m.pos.trim(), def: m.def.trim(), ex: m.ex.trim() }))
    .filter(m => m.def || m.ex);
  const now = Date.now();
  const rec = {
    id, word, ipa: draft.ipa.trim(), meanings,
    context: draft.context.trim(), note: draft.note.trim(),
    box: draft.box ?? 0, due: draft.due ?? now, created: draft.created ?? now, updated: now
  };
  const wasNew = draft.isNew;
  if (!putWord(rec)) return;
  closeEditor();
  toast(wasNew ? '登録しました' : '保存しました');
  if (wasNew) { $('#addInput').value = ''; setStatus(''); }
}

/* ---------- list ---------- */
function renderList() {
  const q = query.trim().toLowerCase();
  const arr = words
    .filter(w => !q || [w.word, w.note, w.context, ...(w.meanings || []).flatMap(m => [m.def, m.ex])].join(' ').toLowerCase().includes(q))
    .sort((a, b) => (b.created || 0) - (a.created || 0));
  const dueN = words.filter(w => (w.due || 0) <= Date.now()).length;
  $('#count').textContent = words.length ? words.length + '語' : '';
  $('#stats').textContent = words.length ? ('復習待ち ' + dueN + '語') : '';
  const list = $('#list');
  if (!arr.length) {
    list.replaceChildren(h('div', { class: 'empty' }, words.length ? '該当する単語がありません' : '知らなかった単語を入力して「調べる」を押すと、ここに溜まっていきます。'));
    return;
  }
  list.replaceChildren(...arr.map(w => {
    const m0 = (w.meanings || [])[0];
    const dl = dueLabel(w);
    return h('div', { class: 'card item', onclick: () => openEditor(w) },
      h('div', { class: 'top' },
        h('span', { class: 'w serif' }, w.word),
        w.ipa ? h('span', { class: 'ipa' }, w.ipa) : null,
        h('span', { class: 'chip' + (dl.due ? ' due' : '') }, dl.t)
      ),
      m0 ? h('div', { class: 'def' }, (m0.pos ? '[' + m0.pos + '] ' : '') + (m0.def || m0.ex)) : null,
      w.note ? h('div', { class: 'def' }, '📝 ' + w.note) : null
    );
  }));
}

/* ---------- review ---------- */
function startReview(all) {
  const now = Date.now();
  const pool = words.filter(w => all || (w.due || 0) <= now).map(w => w.id);
  review = { queue: shuffle(pool), i: 0, shown: false, all: !!all };
  renderReview();
}
function renderReview() {
  const body = $('#revBody');
  $('#revAll').textContent = review.all ? '期限の単語だけ' : '全単語で復習';
  if (!words.length) { $('#revInfo').textContent = ''; body.replaceChildren(h('div', { class: 'empty' }, 'まだ単語がありません。')); return; }
  const id = review.queue[review.i];
  const w = id && byId(id);
  if (!w) {
    $('#revInfo').textContent = '';
    body.replaceChildren(
      h('div', { class: 'empty' }, review.queue.length ? '復習完了です 🎉' : '今日復習する単語はありません。'),
      h('div', { class: 'actions' }, h('button', { class: 'primary', onclick: () => startReview(true) }, '全単語でもう一度'))
    );
    return;
  }
  $('#revInfo').textContent = (review.i + 1) + ' / ' + review.queue.length;
  const kids = [
    h('div', { class: 'big serif' }, w.word),
    w.ipa ? h('div', { class: 'small', style: 'text-align:center;margin-top:4px' }, w.ipa) : null,
    h('div', { style: 'text-align:center;margin-top:8px' },
      h('button', { class: 'ghost', style: 'padding:4px 12px', onclick: e => { e.stopPropagation(); speak(w.word); } }, '🔊'))
  ];
  if (review.shown) {
    (w.meanings || []).forEach(m => kids.push(
      h('div', { class: 'meaning' },
        h('div', {}, (m.pos ? '[' + m.pos + '] ' : '') + m.def),
        m.ex ? h('div', { class: 'ex' }, m.ex) : null)));
    if (w.context) kids.push(h('div', { class: 'meaning' }, h('div', { class: 'small' }, '出会った文'), h('div', {}, w.context)));
    if (w.note) kids.push(h('div', { class: 'meaning' }, h('div', { class: 'small' }, 'メモ'), h('div', {}, w.note)));
  } else {
    kids.push(h('div', { class: 'hint' }, 'タップして答えを表示'));
  }
  const nodes = [h('div', { class: 'card flash', onclick: () => { if (!review.shown) { review.shown = true; renderReview(); } } }, kids)];
  if (review.shown) {
    nodes.push(h('div', { class: 'ans' },
      h('button', { onclick: () => answer(false) }, 'まだ'),
      h('button', { class: 'primary', onclick: () => answer(true) }, '覚えた')));
  }
  body.replaceChildren(...nodes);
}
function answer(ok) {
  const id = review.queue[review.i];
  const w = byId(id);
  if (w) {
    const rec = { ...w };
    if (ok) { rec.box = Math.min((w.box || 0) + 1, LEIT.length - 1); rec.due = Date.now() + LEIT[rec.box] * DAY; }
    else { rec.box = 0; rec.due = Date.now() + 10 * 60 * 1000; review.queue.push(id); }
    putWord(rec);
  }
  review.i++; review.shown = false;
  renderReview();
}

/* ---------- backup ---------- */
const exportJson = () => JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), words }, null, 2);

$('#expSave').addEventListener('click', async () => {
  if (!words.length) { toast('単語がありません'); return; }
  const json = exportJson();
  const name = 'wordbook-' + new Date().toISOString().slice(0, 10) + '.json';
  try {
    const f = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('#expCopy').addEventListener('click', async () => {
  if (!words.length) { toast('単語がありません'); return; }
  try { await navigator.clipboard.writeText(exportJson()); toast('コピーしました'); }
  catch (e) { toast('コピーできませんでした'); }
});
function importText(txt) {
  let data;
  try { data = JSON.parse(txt); } catch (e) { toast('JSONの形式が正しくありません'); return; }
  const arr = Array.isArray(data) ? data : (data && data.words);
  if (!Array.isArray(arr)) { toast('単語データが見つかりません'); return; }
  let n = 0;
  const now = Date.now();
  for (const x of arr) {
    if (!x || typeof x.word !== 'string' || !x.word.trim()) continue;
    const rec = {
      id: toId(x.id || x.word), word: x.word, ipa: x.ipa || '',
      meanings: Array.isArray(x.meanings) ? x.meanings.map(m => ({ pos: m.pos || '', def: m.def || '', ex: m.ex || '' })) : [],
      context: x.context || '', note: x.note || '',
      box: Number.isFinite(x.box) ? x.box : 0, due: Number.isFinite(x.due) ? x.due : now,
      created: Number.isFinite(x.created) ? x.created : now, updated: now
    };
    const i = words.findIndex(w => w.id === rec.id);
    if (i >= 0) words[i] = rec; else words.push(rec);
    n++;
  }
  persistLocal(); renderAll();
  toast(n + '語を読み込みました');
}
$('#impBtn').addEventListener('click', () => {
  const txt = $('#impText').value.trim();
  if (!txt) return;
  importText(txt);
  $('#impText').value = '';
});
$('#impFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { importText(String(r.result)); e.target.value = ''; };
  r.readAsText(f);
});

/* ---------- wiring ---------- */
function renderAll() {
  renderList();
  if (tab === 'review') renderReview();
}
function setTab(t) {
  tab = t;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#view-list').classList.toggle('hide', t !== 'list');
  $('#view-review').classList.toggle('hide', t !== 'review');
  $('#view-settings').classList.toggle('hide', t !== 'settings');
  if (t === 'review') startReview(false);
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#addBtn').addEventListener('click', onLookup);
$('#addInput').addEventListener('keydown', e => { if (e.key === 'Enter') onLookup(); });
$('#manualBtn').addEventListener('click', () => {
  const w = $('#addInput').value.trim();
  const ex = w && byId(toId(w));
  if (ex) { openEditor(ex); return; }
  openEditor({ isNew: true, word: w, ipa: '', meanings: [blankMeaning()], context: '', note: '' });
});
$('#search').addEventListener('input', e => { query = e.target.value; renderList(); });
$('#revAll').addEventListener('click', () => startReview(!review.all));

/* ---------- start ---------- */
words = loadLocal();
renderAll();

(async () => {
  // 端末ストレージの自動削除を避けるようお願いする(対応していれば)
  try {
    if (navigator.storage && navigator.storage.persist) {
      const ok = await navigator.storage.persist();
      $('#persistInfo').textContent = ok ? '保存の保護:有効' : '保存の保護:未確認(バックアップを時々取っておくと安心です)';
    }
  } catch (e) {}
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
